name: Validate backup fix
on:
  push:
    branches: [feature/transfer-fix]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate files
        run: |
          node --check data-transfer.js
          grep -q "exportBackup" data-transfer.js
          grep -q "importBackup" data-transfer.js
          grep -q "swallow-360-v3-backup" sw.js
          ! grep -q "localStorage.clear" data-transfer.js
