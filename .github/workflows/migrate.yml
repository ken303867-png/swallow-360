name: Migrate swallow-360
on:
  push:
    paths:
      - '.github/workflows/migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
      - name: Copy 360 PWA from legacy repository
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/ken303867-png/a/main"
          curl -fsSL "$BASE/360/index.html" -o index.html
          curl -fsSL "$BASE/360/manifest.webmanifest" -o manifest.webmanifest
          curl -fsSL "$BASE/360/sw.js" -o sw.js
          curl -fsSL "$BASE/360/icon.svg" -o icon.svg
          curl -fsSL "$BASE/app.html.gz" -o app.html.gz
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('../app.html.gz?v=24','./app.html.gz?v=1').replace('../app.html.gz','./app.html.gz')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8').replace('dysphagia-360-pwa-v1','swallow-360-v1').replace('../app.html.gz','./app.html.gz')
          p.write_text(s,encoding='utf-8')
          PY
          cat > README.md <<'EOF'
          # swallow-360
          摂食嚥下障害看護認定看護師 試験対策360問 PWA。
          旧 `ken303867-png/a/360/` から独立したリポジトリである。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icon.svg app.html.gz README.md
          git commit -m "Migrate swallow-360 PWA from legacy repository"
          git push origin HEAD:main
